<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bay Area GFC Cycle Map: home values, jobs, supply rate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F2; --panel:#FFFFFF; --water:#D3DFE7; --land:#ECEEE8; --border:#8C98A4; --ink:#1B2430; --ink2:#5A6675; --navy:#1F3864; --line:#DCE1E6;
  --lo:#F8696B; --mid:#FFEB84; --hi:#63BE7B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#171B21; --panel:#1F252D; --water:#25313C; --land:#2C333B; --border:#6F7C89; --ink:#EDF0F3; --ink2:#A7B1BC; --navy:#C9D6EA; --line:#333B45; } }
:root[data-theme="dark"]{ --paper:#171B21; --panel:#1F252D; --water:#25313C; --land:#2C333B; --border:#6F7C89; --ink:#EDF0F3; --ink2:#A7B1BC; --navy:#C9D6EA; --line:#333B45; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;height:100%}
.wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,420px);gap:0;min-height:100%}
.mapcol{position:relative;background:var(--water);}
.mapcol svg{width:100%;height:auto;display:block;max-height:100vh}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:22px 22px 28px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;max-height:100vh}
h1{font-size:19px;font-weight:600;color:var(--navy);margin:0 0 4px;line-height:1.25}
.sub{color:var(--ink2);font-size:12.5px;margin:0}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg button:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
.legend{display:flex;flex-direction:column;gap:5px}
.bar{height:12px;border-radius:3px;background:linear-gradient(90deg,var(--lo) 0%,var(--mid) 50%,var(--hi) 100%);border:1px solid var(--line)}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chips button:focus-visible{outline:2px solid var(--hi)}
.opts{display:flex;gap:16px;font-size:12.5px;color:var(--ink2)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.row:hover,.row.active{background:var(--land)}
.row .rk{color:var(--ink2);font-variant-numeric:tabular-nums}
.row .cty{color:var(--ink2);font-size:11.5px;display:block}
.row .sc{min-width:46px;text-align:center;padding:2px 6px;border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums;color:#1B2430}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:250px;display:none;z-index:5}
.tip b{font-size:13.5px;color:var(--navy)}
.tip table{border-collapse:collapse;margin-top:4px}
.tip td{padding:1px 8px 1px 0;color:var(--ink2)}
.tip td:last-child{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
.county-label{font-size:11px;font-weight:600;fill:var(--ink);letter-spacing:.04em;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;opacity:.9}
.city-label{font-size:8.5px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:2.5px;stroke-linejoin:round}
.city{stroke:#FFFFFF;stroke-width:0.9;stroke-linejoin:round;cursor:pointer}
.city.dim{opacity:.18}
.city.active,.city.hot{stroke:var(--ink);stroke-width:1.8}
.dot{stroke:#fff;stroke-width:1.1;cursor:pointer;transition:r .12s ease}
.dot.dim{opacity:.18}
.dot.active{stroke:var(--ink);stroke-width:2}
.zoom{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:4}
.zoom button{width:36px;height:32px;font:inherit;font-size:16px;line-height:1;background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:5px;cursor:pointer}
.zoom button#zreset{width:auto;padding:0 8px;font-size:11.5px}
.zoom button:focus-visible{outline:2px solid var(--hi)}
.hint{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 7px;opacity:.9;pointer-events:none}
.mapcol svg{cursor:grab;touch-action:none}
.mapcol svg.dragging{cursor:grabbing}
.float{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;gap:6px;align-items:center}
.seg.segf{background:var(--panel);min-width:270px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.seg.ds button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.sub2{display:flex;flex-direction:column;gap:8px}
.sub2 .lab{font-size:11.5px;color:var(--ink2)}
.city.nofill{fill:none;stroke:var(--panel);stroke-width:0.5;opacity:.7;pointer-events:none}
.city.unscored{fill:#C9CED3;stroke:#FFFFFF}
.county.filled{cursor:pointer}
.county.active{stroke:var(--ink);stroke-width:2.2}
.county.dim{opacity:.25}
.key{display:flex;gap:10px;font-size:11.5px;color:var(--ink2);align-items:center}
.key i{display:inline-block;width:12px;height:12px;border-radius:2px;background:#C9CED3;border:1px solid var(--line)}
.bar.rev{background:linear-gradient(90deg,var(--hi) 0%,var(--mid) 50%,var(--lo) 100%)}
.tip.wide{max-width:340px}
.tip .sec{margin-top:6px;border-top:1px solid var(--line);padding-top:5px}
.tip .sec .h{color:var(--navy);font-weight:600;margin-bottom:2px}
.tip .sr{display:grid;grid-template-columns:1fr 62px 44px;gap:6px;align-items:center;font-size:11.5px;line-height:1.35}
.tip .sr .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .sr .j{text-align:right;font-variant-numeric:tabular-nums}
.tip .sr .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tip .sr .bg{grid-column:1/4;height:3px;background:var(--line);border-radius:2px;margin:-1px 0 2px}
.tip .sr .bg i{display:block;height:3px;background:var(--navy);border-radius:2px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--panel)}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:var(--ink)}
.search button{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:14px;padding:0 2px}
.search svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:2}
.src{font-size:11px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
@media (max-width:860px){ .wrap{grid-template-columns:1fr} .float{display:none} .panel{max-height:none;border-left:0;border-top:1px solid var(--line)} .mapcol svg{max-height:none} }
@media (prefers-reduced-motion: reduce){ .dot{transition:none} }
</style>

    :`<div class="sr"><span class="n">${s.name}</span><span class="j">${f0(s.jobs)}</span><span class="p">${(s.share*100).toFixed(1)}%</span><span class="bg"><i style="width:${(s.jobs/mx*100).toFixed(1)}%"></i></span></div>`).join('');
  const resid=x.residual>50?`<div class="sr"><span class="n">Not disclosed / unclassified</span><span class="j">${f0(x.residual)}</span><span class="p">${(x.residual/x.total_2025*100).toFixed(1)}%</span></div>`:'';
  tip.innerHTML=`<b>${n} County</b>${city?`<br><span style="color:var(--ink2)">${city} (county-level score)</span>`:''}<br><span style="color:var(--ink2)">Jobs (QCEW)</span>
  <table>${scoreRows(countyScore(n))}<tr><td>Pre-GFC peak</td><td>${x.pk_yr}: ${f0(x.pk)}</td></tr><tr><td>Trough</td><td>${x.tr_yr}: ${f0(x.tr)} (${x.dd}%)</td></tr><tr><td>Regained peak</td><td>${x.rec_yr||'not yet'} (${x.rec} yrs)</td></tr><tr><td>Later peak</td><td>${x.lp_yr}: ${f0(x.lp)}</td></tr><tr><td>Latest (2025)</td><td>${f0(x.latest)} ${unit}</td></tr><tr><td>Latest vs pre-GFC</td><td>${pctf(x.lvp)}</td></tr></table>
  <div class="sec"><div class="h">2025 jobs by sector (share of ${f0(x.total_2025)})</div>${rows}${resid}</div>`;
  tip.classList.add('wide'); tip.style.display='block'; moveTip(e); }
function moveTip(e){ const r=svg.parentElement.getBoundingClientRect(); const tw=tip.offsetWidth||270, th=tip.offsetHeight||230; let x=e.clientX-r.left+14, y=e.clientY-r.top+14;
  if(x+tw+10>r.width) x=Math.max(4,e.clientX-r.left-tw-14); if(y+th+10>r.height) y=Math.max(4,r.height-th-10); tip.style.left=x+'px'; tip.style.top=y+'px'; }
function setActive(name){ active=name;
  for(const k in polys){ polys[k].classList.toggle('active',ds!=='emp'&&k===name); dots[k].classList.toggle('active',ds!=='emp'&&k===name); }
  for(const k in cpolys) cpolys[k].classList.toggle('active',ds==='emp'&&k===name);
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('active',r.dataset.key===name));
  if(!name){tip.style.display='none';return}
  const el_=ds==='emp'?cpolys[name]:polys[name]; const b=el_.getBoundingClientRect(); const fake={clientX:b.left+b.width/2,clientY:b.top+b.height/2};
  if(ds==='emp') showCountyTip(name,fake); else showTip(DATA.cities.find(z=>z.city===name),fake);
  document.querySelector(`.row[data-key="${CSS.escape(name)}"]`)?.scrollIntoView({block:'nearest'}); }
let nOk=0; function supplyRank(c){ const v=cityScore(c).v; return DATA.cities.filter(z=>{const s=cityScore(z); return s.ok&&s.v<v}).length+1; }
function render(){ const sc=SCORES[metric], D=DS[ds]; const isP=D.kind==='pct';
  const tail=isP?null:metric;
  document.getElementById('h1').textContent=D.h1(sc); document.getElementById('sub').textContent=D.sub(sc); document.getElementById('src').textContent=D.src+' City and county boundaries: U.S. Census Bureau 2023 cartographic boundary files, generalized. Direct links: #'+D.hash+(series?'-'+series:'')+(tail?'-'+tail:'');
  document.title=`Bay Area GFC cycle map: ${D.name}${isP?', '+SERNAME[series].toLowerCase():', '+sc.name.toLowerCase()}`;
  const hash='#'+D.hash+(series?'-'+series:'')+(tail?'-'+tail:''); if(location.hash!==hash) history.replaceState(null,'',hash);
  document.getElementById('key').style.display=isP?'':'none';
  document.querySelectorAll('.seg.sc').forEach(x=>x.style.display=isP?'none':'');
  document.querySelector('.search').style.display=ds==='emp'?'none':''; if(ds==='emp'&&q){ q=''; document.getElementById('q').value=''; document.getElementById('qx').style.display='none'; }
  document.getElementById('bar').classList.toggle('rev',isP);
  document.getElementById('ticks').innerHTML=isP?'<span>0% least new supply</span><span>1%</span><span>2%+ most</span>':'<span>0 weakest</span><span>50</span><span>100 strongest</span>';
  nOk=DATA.cities.filter(c=>cityScore(c).ok).length;
  // series toggle
  const ser=document.getElementById('ser');
  if(D.series){ ser.style.display=''; ser.innerHTML=D.series.map(([k,n])=>`<button data-s="${k}" aria-pressed="${k===series}">${n}</button>`).join(''); ser.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{series=b.dataset.s; render()})); } else ser.style.display='none';
  // fills
  if(ds==='emp'){
    for(const [n,p] of Object.entries(cpolys)){ p.setAttribute('fill',color(countyScore(n)[sc.k])); p.classList.add('filled'); p.classList.toggle('dim',county&&n!==county); }
    for(const c of DATA.cities){ const p=polys[c.city]; p.setAttribute('fill','none'); p.classList.add('nofill'); p.classList.remove('unscored'); p.classList.toggle('dim',false); dots[c.city].setAttribute('fill',color(countyScore(c.county)[sc.k])); dots[c.city].classList.toggle('dim',county&&c.county!==county); }
  } else {
    for(const [n,p] of Object.entries(cpolys)){ p.setAttribute('fill','var(--land)'); p.classList.remove('filled','dim','active'); }
    for(const c of DATA.cities){ const p=polys[c.city]; p.classList.remove('nofill'); const v=cityScore(c);
      const col=v.ok?(isP?colorPct(v.v):color(v[sc.k])):null;
      if(v.ok){ p.classList.remove('unscored'); p.setAttribute('fill',col); dots[c.city].setAttribute('fill',col); } else { p.classList.add('unscored'); p.removeAttribute('fill'); dots[c.city].setAttribute('fill','#C9CED3'); }
      p.classList.toggle('dim',county&&c.county!==county); dots[c.city].classList.toggle('dim',county&&c.county!==county); }
  }
  // list
  if(ds==='emp'){
    const rows=Object.keys(DATA.county_data).filter(n=>!q||n.toLowerCase().includes(q)).map(n=>({key:n,name:n,sub:'',v:countyScore(n)})).sort((a,b)=>a.v[sc.r]-b.v[sc.r]);
    list.innerHTML=rows.map(r=>`<div class="row" data-key="${r.key}"><span class="rk">${r.v[sc.r]}</span><span>${r.name} County</span><span class="sc" style="background:${color(r.v[sc.k])}">${r.v[sc.k].toFixed(1)}</span></div>`).join('');
    document.getElementById('count').textContent=`9 counties, jobs, ${sc.name.toLowerCase()}`;
  } else {
    const vis=DATA.cities.filter(c=>(!county||c.county===county)&&(!q||c.city.toLowerCase().includes(q))).map(c=>({c,v:cityScore(c)}));
    const ok=vis.filter(x=>x.v.ok).sort((a,b)=>isP?(a.v.v-b.v.v):(a.v[sc.r]-b.v[sc.r])); const no=vis.filter(x=>!x.v.ok).sort((a,b)=>a.c.city.localeCompare(b.c.city));
    list.innerHTML=ok.map(({c,v})=>`<div class="row" data-key="${c.city}"><span class="rk">${isP?supplyRank(c):v[sc.r]}</span><span>${c.city}<span class="cty">${c.county}</span></span><span class="sc" style="background:${isP?colorPct(v.v):color(v[sc.k])}">${isP?pf(v.v):v[sc.k].toFixed(1)}</span></div>`).join('')
      + no.map(({c,v})=>`<div class="row" data-key="${c.city}"><span class="rk">–</span><span>${c.city}<span class="cty">${c.county} · no permit data</span></span><span class="sc" style="background:#C9CED3">–</span></div>`).join('');
    document.getElementById('count').textContent=isP?`${ok.length} cities ranked low to high${no.length?', '+no.length+' without permit data':''}`:`${ok.length} scored${no.length?', '+no.length+' not scored':''}, ${sc.name.toLowerCase()}`;
  }
  list.querySelectorAll('.row').forEach(r=>{ const k=r.dataset.key; r.addEventListener('click',()=>setActive(active===k?null:k));
    r.addEventListener('mouseenter',()=>{(ds==='emp'?cpolys[k]:polys[k]).classList.add('hot'); if(dots[k])dots[k].setAttribute('r',9/view.k)}); r.addEventListener('mouseleave',()=>{(ds==='emp'?cpolys[k]:polys[k]).classList.remove('hot'); if(dots[k])dots[k].setAttribute('r',6/view.k)}); });
  document.querySelectorAll('.seg.ds button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d===ds));
  document.querySelectorAll('.seg.sc button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===metric));
  applyView(); if(active) setActive(active); }
function setDs(k){ if(k===ds) return; ds=k; active=null; tip.style.display='none'; series=DS[k].series?DS[k].series[0][0]:null; render(); }
document.querySelectorAll('.seg.ds button').forEach(b=>b.addEventListener('click',()=>setDs(b.dataset.d)));
document.querySelectorAll('.seg.sc button').forEach(b=>b.addEventListener('click',()=>{metric=b.dataset.m; render()}));
const chips=document.getElementById('chips'); const cn=[...new Set(DATA.cities.map(c=>c.county))].sort();
chips.innerHTML=`<button data-c="" aria-pressed="true">All counties</button>`+cn.map(c=>`<button data-c="${c}" aria-pressed="false">${c}</button>`).join('');
chips.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{county=b.dataset.c||null; chips.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(); zoomToCounty(county)}));
document.getElementById('labels').addEventListener('change',e=>{gL.style.display=e.target.checked?'':'none'});
const qEl=document.getElementById('q'), qx=document.getElementById('qx');
qEl.addEventListener('input',()=>{ q=qEl.value.trim().toLowerCase(); qx.style.display=q?'':'none'; render(); });
qEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const first=list.querySelector('.row'); if(first){ const k=first.dataset.key; setActive(k); if(ds!=='emp'){ const c=DATA.cities.find(z=>z.city===k); if(c) zoomToPoint(c); } } } if(e.key==='Escape'){ qEl.value=''; q=''; qx.style.display='none'; render(); } });
qx.addEventListener('click',()=>{ qEl.value=''; q=''; qx.style.display='none'; render(); qEl.focus(); });
function zoomToPoint(c){ const k=Math.max(view.k,4); view.k=k; view.tx=W/2-k*c.x; view.ty=H/2-k*c.y; clamp(); applyView(); }
document.getElementById('points').addEventListener('change',e=>{gD.style.display=e.target.checked?'':'none'});
function fromHash(){ const h=location.hash.replace('#',''); if(!h) return false; const parts=h.split('-'); const d=Object.keys(DS).find(k=>DS[k].hash===parts[0]); if(!d) return false;
  ds=d; if(DS[d].series){ const sk=DS[d].series.map(x=>x[0]); series=sk.includes(parts[1])?parts[1]:sk[0]; } else series=null;
  const m=parts[parts.length-1]; if(DS[d].kind!=='pct') metric=SCORES[m]?m:'comb'; return true; }
window.addEventListener('hashchange',()=>{ if(fromHash()) render(); });
// ---- zoom and pan ----
const view={k:1,tx:0,ty:0}; const KMIN=1,KMAX=14;
function applyView(){ root.setAttribute('transform',`translate(${view.tx} ${view.ty}) scale(${view.k})`);
  const k=view.k; gD.querySelectorAll('.dot').forEach(d=>{d.setAttribute('r',6/k); d.style.strokeWidth=(1.1/k)+'px'});
  gL.querySelectorAll('text').forEach(t=>{t.style.fontSize=(8.5/Math.sqrt(k))+'px'; t.style.strokeWidth=(2.5/k)+'px'; const c=DATA.cities.find(z=>z.city===t.textContent); if(c){t.setAttribute('x',c.x+7/k); t.setAttribute('y',c.y+3/k)}});
  gC.querySelectorAll('.county').forEach(p=>p.style.strokeWidth=((p.classList.contains('active')?2.2:0.8)/k)+'px');
  gP.querySelectorAll('.city').forEach(p=>p.style.strokeWidth=((p.classList.contains('active')||p.classList.contains('hot')?1.8:(p.classList.contains('nofill')?0.5:0.9))/k)+'px');
  gT.querySelectorAll('.county-label').forEach(t=>t.style.fontSize=(11/Math.sqrt(k))+'px');
  document.getElementById('zreset').style.visibility=view.k>1?'visible':'hidden'; }
function svgPoint(cx,cy){ const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; const m=svg.getScreenCTM().inverse(); const p=pt.matrixTransform(m); return [p.x,p.y]; }
function zoomAt(factor,cx,cy){ const [sx,sy]=svgPoint(cx,cy); const k2=Math.max(KMIN,Math.min(KMAX,view.k*factor)); const f=k2/view.k;
  view.tx=sx-(sx-view.tx)*f; view.ty=sy-(sy-view.ty)*f; view.k=k2; if(view.k===1){view.tx=0;view.ty=0} clamp(); applyView(); }
function clamp(){ const k=view.k; view.tx=Math.min(0,Math.max(W-W*k,view.tx)); view.ty=Math.min(0,Math.max(H-H*k,view.ty)); }
svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.25:0.8,e.clientX,e.clientY); },{passive:false});
svg.addEventListener('dblclick',e=>{ zoomAt(1.8,e.clientX,e.clientY); });
let drag=null;
svg.addEventListener('pointerdown',e=>{ if(e.button!==0&&e.pointerType==='mouse') return; drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag||pinch) return; const r=svg.getBoundingClientRect(); const sc=W/r.width; const dx=(e.clientX-drag.x)*sc, dy=(e.clientY-drag.y)*sc;
  if(Math.abs(dx)+Math.abs(dy)>2){drag.moved=true; svg.classList.add('dragging'); tip.style.display='none'} view.tx=drag.tx+dx; view.ty=drag.ty+dy; clamp(); applyView(); });
let dragMoved=false; const endDrag=e=>{ dragMoved=!!(drag&&drag.moved); svg.classList.remove('dragging'); drag=null; };
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
let pinch=null;
svg.addEventListener('touchstart',e=>{ if(e.touches.length===2){ drag=null; const [a,b]=e.touches; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),k:view.k}; } },{passive:true});
svg.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length===2){ e.preventDefault(); const [a,b]=e.touches; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); const cx=(a.clientX+b.clientX)/2, cy=(a.clientY+b.clientY)/2; zoomAt((pinch.k*d/pinch.d)/view.k,cx,cy); } },{passive:false});
svg.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; },{passive:true});
document.getElementById('zin').addEventListener('click',()=>{ const r=svg.getBoundingClientRect(); zoomAt(1.5,r.left+r.width/2,r.top+r.height/2); });
document.getElementById('zout').addEventListener('click',()=>{ const r=svg.getBoundingClientRect(); zoomAt(1/1.5,r.left+r.width/2,r.top+r.height/2); });
document.getElementById('zreset').addEventListener('click',()=>{ view.k=1;view.tx=0;view.ty=0; applyView(); });
function zoomToCounty(name){ if(!name){view.k=1;view.tx=0;view.ty=0;applyView();return}
  const pts=DATA.cities.filter(c=>c.county===name); const xs=pts.map(c=>c.x), ys=pts.map(c=>c.y);
  const x0=Math.min(...xs)-40,x1=Math.max(...xs)+40,y0=Math.min(...ys)-40,y1=Math.max(...ys)+40;
  const k=Math.max(KMIN,Math.min(KMAX,Math.min(W/(x1-x0),H/(y1-y0)))); view.k=k; view.tx=W/2-k*(x0+x1)/2; view.ty=H/2-k*(y0+y1)/2; clamp(); applyView(); }
fromHash(); render();
</script>
